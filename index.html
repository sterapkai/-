<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<title>統計的推測ラボ</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>

<h1>📊 統計的推測ラボ</h1>

</header>

<div class="container">

<section class="panel">

<h2>生徒情報</h2>

<input id="studentName"
placeholder="氏名">

</section>

<section class="panel">

<h2>標本抽出</h2>

<button onclick="runSample(1)">1人</button>

<button onclick="runSample(25)">25人</button>

<button onclick="runSample(100)">100人</button>

<button onclick="runSample(1000)">1000人</button>

<div id="result"></div>

</section>

<section class="panel">

<h2>条件付き分析</h2>

<select id="gender">

<option value="">全員</option>

<option value="男性">男性</option>

<option value="女性">女性</option>

</select>

<button onclick="analyzeCondition()">

分析

</button>

</section>

<section class="panel">

<h2>標本分布</h2>

<canvas id="histChart"></canvas>

</section>

<section class="panel">

<h2>散布図</h2>

<canvas id="scatterChart"></canvas>

</section>

<section class="panel">

<h2>誤差と標本数</h2>

<canvas id="errorChart"></canvas>

</section>

<section class="panel">

<h2>考察生成</h2>

<button onclick="createReport()">

考察例を作る

</button>

<textarea id="report"></textarea>

</section>

</div>

<script src="app.js"></script>

</body>
</html>
